name: CI — Batik Kita Quality Gate

on:
  push:
    branches: [main, dev]
    paths:
      - "webdev/frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "webdev/frontend/**"

defaults:
  run:
    working-directory: webdev/frontend

jobs:
  quality-gate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webdev/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint — Check code style
        run: npm run lint

      - name: TypeScript — Zero-error typecheck
        run: npx tsc --noEmit

      - name: Next.js — Production build
        run: npm run build
        env:
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-placeholder' }}
